<!DOCTYPE html>
<!--
  Mason's Book Nook — a personal digital library
  Made by Mason Teibel
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#a3005c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Book Nook">
<title>Mason's Book Nook</title>
<style>
  :root{
    --bg:#faf6ef; --panel:#ffffff; --ink:#2b2233; --muted:#8b7f96;
    --brand:#5b3a91; --brand2:#8a5cd1; --accent:#f0a500; --gold:#f6c945;
    --line:#e7ddef; --shadow:0 6px 18px rgba(0,0,0,.45);
    --ok:#2e9e6b; --wish:#e8734a;
    --page:#000000;              /* black app background */
    --onblack:#cdbfe6;           /* readable text on the black background */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%}
  body{
    font-family:"Segoe UI",system-ui,Arial,sans-serif;
    background:var(--page); color:var(--ink);
    display:flex; flex-direction:column; min-height:100dvh;
  }
  /* ---- Header ---- */
  header{
    background:linear-gradient(135deg,#a3005c,#d63384);
    color:#fff; padding:14px 16px calc(14px + env(safe-area-inset-top)) 16px;
    padding-top:calc(14px + env(safe-area-inset-top));
    text-align:center; box-shadow:var(--shadow); position:relative; z-index:3;
  }
  header h1{margin:0; font-size:22px; letter-spacing:.3px}
  header .sub{font-size:12px; opacity:.85; margin-top:2px}
  header .count{font-size:12px; opacity:.9; margin-top:4px}

  main{flex:1; overflow-y:auto; padding:14px 14px 90px; -webkit-overflow-scrolling:touch}
  .view{display:none; animation:fade .2s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---- Search + filters ---- */
  .searchbar{position:relative; margin-bottom:10px}
  .searchbar input{
    width:100%; padding:13px 14px 13px 40px; font-size:16px; border-radius:14px;
    border:2px solid var(--line); background:#fff; color:var(--ink); outline:none;
  }
  .searchbar input:focus{border-color:var(--brand2)}
  .searchbar .mag{position:absolute; left:13px; top:12px; font-size:18px; opacity:.5}
  .chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:6px; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto; padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600;
    border:2px solid var(--line); background:#fff; color:var(--muted); white-space:nowrap; cursor:pointer;
  }
  .chip.active{background:var(--brand); border-color:var(--brand); color:#fff}
  .filterrow{display:flex; gap:8px; margin-bottom:10px}
  .filterrow select{
    flex:1; padding:10px; border-radius:12px; border:2px solid var(--line); background:#fff;
    font-size:14px; color:var(--ink); min-width:0;
  }

  /* ---- Book cards ---- */
  .genrebtn{width:100%; margin-bottom:12px}
  .genrerow{display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left;
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:8px;
    font-size:16px; font-weight:600; color:var(--ink); cursor:pointer}
  .genrerow:active{transform:scale(.99)}
  .genrerow.all{background:#f5efff; border-color:#e0d2f5}
  .gcount{background:#f0e9f8; color:var(--brand); border-radius:999px; padding:3px 12px; font-size:14px; font-weight:800; flex:0 0 auto}
  /* Series tracker */
  .seriescard{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; box-shadow:var(--shadow); cursor:pointer}
  .seriescard:active{transform:scale(.99)}
  .seriescard .top{display:flex; justify-content:space-between; align-items:center; gap:10px}
  .seriescard .nm{font-weight:700; font-size:17px; min-width:0}
  .prog{height:9px; background:#eee6f5; border-radius:999px; overflow:hidden; margin-top:10px}
  .prog>span{display:block; height:100%; background:linear-gradient(90deg,var(--brand),var(--brand2)); transition:width .3s}
  .progtxt{font-size:12px; color:var(--muted); margin-top:6px}
  .checkitem{display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px}
  .checkitem .box{width:28px; height:28px; border-radius:8px; border:2px solid var(--brand); flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:17px; color:#fff; background:#fff; cursor:pointer}
  .checkitem.on .box{background:var(--ok); border-color:var(--ok)}
  .checkitem .ct{flex:1; font-weight:600; word-break:break-word}
  .checkitem.on .ct{color:var(--muted); text-decoration:line-through}
  .checkitem .rm{color:#d66; font-size:20px; cursor:pointer; padding:2px 8px; flex:0 0 auto}
  .addrow{display:flex; gap:8px; margin:6px 0 4px}
  .addrow input{flex:1; padding:12px; border-radius:12px; border:2px solid var(--line); font-size:16px; min-width:0}
  .letter{font-weight:800; color:#b79ae6; margin:14px 4px 6px; font-size:15px; letter-spacing:1px}
  .book{
    display:flex; gap:12px; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:10px; margin-bottom:10px; box-shadow:var(--shadow); cursor:pointer;
    align-items:center;
  }
  .book:active{transform:scale(.99)}
  .cover{
    width:52px; height:74px; border-radius:8px; flex:0 0 auto; object-fit:cover;
    background:linear-gradient(135deg,#d9c9ef,#efe3ff); display:flex; align-items:center; justify-content:center;
    font-size:26px; color:#7a5cb0; overflow:hidden;
  }
  .binfo{flex:1; min-width:0}
  .binfo .t{font-weight:700; font-size:16px; line-height:1.2; margin-bottom:3px}
  .binfo .a{font-size:13px; color:var(--muted); margin-bottom:4px}
  .tags{display:flex; gap:5px; flex-wrap:wrap}
  .tag{font-size:11px; padding:2px 8px; border-radius:999px; background:#f0e9f8; color:var(--brand); font-weight:600}
  .tag.series{background:#fff2df; color:#b57400}
  .tag.year{background:#e9f3ff; color:#2f6bbf}

  .empty{text-align:center; color:var(--onblack); padding:50px 20px}
  .empty .big{font-size:52px; margin-bottom:10px}
  .empty .btnlink{color:#b79ae6; font-weight:700; cursor:pointer; text-decoration:underline}

  /* ---- Buttons ---- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:14px 18px; border-radius:14px; border:none; font-size:16px; font-weight:700;
    background:var(--brand); color:#fff; cursor:pointer; width:100%;
  }
  .btn:active{transform:scale(.98)}
  .btn.gold{background:var(--accent)}
  .btn.wish{background:var(--wish)}
  .btn.ghost{background:#fff; color:var(--brand); border:2px solid var(--brand)}
  .btn.sm{padding:10px 14px; font-size:14px; width:auto}
  .btn.danger{background:#e14b4b}

  /* ---- Scan ---- */
  .scanwrap{background:#000; border-radius:18px; overflow:hidden; position:relative; aspect-ratio:3/4; margin-bottom:12px}
  #scanVideo{width:100%; height:100%; object-fit:cover; display:block}
  .scanframe{position:absolute; inset:18% 12%; border:3px solid rgba(255,255,255,.9); border-radius:16px; box-shadow:0 0 0 999px rgba(0,0,0,.35)}
  .scanhint{position:absolute; bottom:12px; left:0; right:0; text-align:center; color:#fff; font-size:13px; text-shadow:0 1px 3px #000}
  .scanline{position:absolute; left:12%; right:12%; height:3px; background:var(--gold); box-shadow:0 0 10px var(--gold); top:50%; animation:scan 2s ease-in-out infinite}
  @keyframes scan{0%,100%{top:22%}50%{top:76%}}
  .manual{display:flex; gap:8px; margin-top:6px}
  .manual input{flex:1; padding:13px; border-radius:12px; border:2px solid var(--line); font-size:16px}

  /* ---- Modal ---- */
  .modal{position:fixed; inset:0; background:rgba(30,15,50,.55); display:none; align-items:flex-end; justify-content:center; z-index:50}
  .modal.show{display:flex}
  .sheetwrap{position:relative; width:100%; max-width:520px}
  .sheetback{
    position:absolute; top:12px; left:12px; z-index:12;
    background:var(--brand); color:#fff; border:none; border-radius:999px;
    padding:8px 14px; font-size:14px; font-weight:800; cursor:pointer; box-shadow:var(--shadow);
  }
  .sheetback:active{transform:scale(.96)}
  .sheet{
    background:var(--bg); width:100%; max-width:520px; border-radius:22px 22px 0 0; padding:18px 18px calc(24px + env(safe-area-inset-bottom));
    max-height:92dvh; overflow-y:auto; animation:up .25s ease;
  }
  @keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
  .sheet .grip{width:44px; height:5px; background:#d8cae8; border-radius:3px; margin:0 auto 14px}
  /* Single book page (view mode) */
  .bookpage{text-align:center; padding:4px 0 8px}
  .bookpage .cover{display:inline-flex; width:128px; height:182px; font-size:54px; margin:0 auto 14px; box-shadow:var(--shadow)}
  .bp-title{margin:0 0 5px; font-size:22px; line-height:1.25}
  .bp-author{color:var(--muted); font-size:15px}
  .infobox{background:#fff; border:1px solid var(--line); border-radius:14px; padding:2px 14px; margin:6px 0 14px}
  .inforow{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line)}
  .inforow:last-child{border-bottom:none}
  .inforow .ik{font-weight:600; font-size:14px}
  .inforow .iv{font-weight:800; text-align:right; word-break:break-word; color:var(--brand)}
  .detail-top{display:flex; gap:14px; margin-bottom:14px}
  .detail-top .cover{width:92px; height:132px; font-size:40px}
  .detail-top h2{margin:0 0 6px; font-size:20px; line-height:1.2}
  .detail-top .by{color:var(--muted); font-size:15px}
  .field{margin-bottom:12px}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.5px}
  .field input{width:100%; padding:12px; border-radius:12px; border:2px solid var(--line); font-size:16px; background:#fff}
  .btnrow{display:flex; gap:10px; margin-top:8px}
  .btnrow .btn{flex:1}

  /* ---- Find results ---- */
  .loading{text-align:center; color:var(--muted); padding:30px}
  .spinner{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .addbtns{display:flex; gap:6px; flex-direction:column}
  .miniadd{padding:7px 10px; font-size:12px; border-radius:10px; border:none; font-weight:700; cursor:pointer; white-space:nowrap}
  .miniadd.lib{background:var(--brand); color:#fff}
  .miniadd.wl{background:var(--wish); color:#fff}
  .miniadd.have{background:#e6efe9; color:var(--ok)}

  /* ---- Toast ---- */
  #toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:12px 18px; border-radius:999px; font-weight:600; font-size:14px;
    opacity:0; pointer-events:none; transition:.25s; z-index:60; max-width:90%; text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  /* ---- Tab bar ---- */
  nav{
    position:fixed; bottom:0; left:0; right:0; display:flex; background:#12121a;
    border-top:1px solid #2a2438; padding-bottom:env(safe-area-inset-bottom); z-index:40;
    box-shadow:0 -4px 16px rgba(0,0,0,.5);
  }
  nav button{
    flex:1; border:none; background:none; padding:9px 4px 8px; font-size:11px; font-weight:600;
    color:#8f84a3; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  nav button .ic{font-size:22px; line-height:1}
  nav button.active{color:#b79ae6}
  nav button.active .ic{transform:translateY(-1px)}

  .credit{text-align:center; color:var(--onblack); font-size:12px; margin:18px 0 4px}
  .credit b{color:#c9b6f2}

  /* Library book-count banner with a crowd of stickmen behind it */
  .countbanner{position:relative; overflow:hidden; border-radius:18px; margin-bottom:14px;
    background:linear-gradient(135deg,#a3005c,#d63384); box-shadow:0 4px 14px rgba(0,0,0,.35); min-height:104px}
  .countbanner .stickbg{position:absolute; inset:0; width:100%; height:100%}
  .countinner{position:relative; z-index:1; text-align:center; padding:18px 12px}
  .countnum{font-size:46px; font-weight:900; color:#fff; line-height:1; text-shadow:0 2px 6px rgba(0,0,0,.45)}
  .countlbl{font-size:14px; font-weight:800; color:#ffd9ec; letter-spacing:.4px; margin-top:5px}
</style>
</head>
<body>

<header>
  <h1>📚 Mason's Book Nook</h1>
  <div class="sub">Scan it • Save it • Wish for it</div>
  <div class="count" id="hcount"></div>
</header>

<main>
  <!-- ===== LIBRARY ===== -->
  <section class="view active" id="view-library">
    <div class="countbanner" id="libCountBanner">
      <svg class="stickbg" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
        <defs>
          <pattern id="stickpat" width="46" height="58" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
            <g fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="11" r="5.5"/>
              <line x1="12" y1="16.5" x2="12" y2="33"/>
              <line x1="2" y1="24" x2="22" y2="24"/>
              <line x1="12" y1="33" x2="4" y2="45"/>
              <line x1="12" y1="33" x2="20" y2="45"/>
              <circle cx="35" cy="40" r="5.5"/>
              <line x1="35" y1="45.5" x2="35" y2="62"/>
              <line x1="25" y1="53" x2="45" y2="53"/>
            </g>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#stickpat)"/>
      </svg>
      <div class="countinner">
        <div class="countnum" id="libCountNum">0</div>
        <div class="countlbl" id="libCountLbl">books scanned</div>
      </div>
    </div>
    <div class="searchbar">
      <span class="mag">🔍</span>
      <input id="libSearch" placeholder="Search title, author, genre, series…" autocomplete="off">
    </div>
    <div class="filterrow">
      <select id="genreFilter"><option value="">All genres</option></select>
      <select id="seriesFilter"><option value="">All series</option></select>
    </div>
    <button class="btn ghost sm genrebtn" id="genreListBtn">🏷️ See all my genres</button>
    <button class="btn ghost sm" id="shareBtn" style="width:100%;margin-bottom:12px">👥 Share my library</button>
    <button class="btn ghost sm" id="trashBtnLib" style="width:100%;margin-bottom:12px;display:none">🗑️ Recently Deleted</button>
    <div id="libList"></div>
  </section>

  <!-- ===== SCAN ===== -->
  <section class="view" id="view-scan">
    <div class="scanwrap">
      <video id="scanVideo" playsinline muted></video>
      <div class="scanframe"></div>
      <div class="scanline"></div>
      <div class="scanhint" id="scanHint">Point at the barcode on the back of the book</div>
    </div>
    <button class="btn gold" id="scanToggle">📷 Start Camera</button>
    <div class="manual">
      <input id="isbnInput" inputmode="numeric" placeholder="…or type the ISBN number">
      <button class="btn sm" id="isbnGo" style="width:auto">Look up</button>
    </div>
    <p style="color:var(--muted);font-size:13px;text-align:center;margin-top:14px">
      The ISBN is the number under the barcode. It usually starts with 978.
    </p>
    <button class="btn ghost sm" id="diagBtn" style="width:100%;margin-top:10px">🔧 Camera not working? Tap to check</button>
    <div id="scanDiag"></div>
  </section>

  <!-- ===== WISH LIST ===== -->
  <section class="view" id="view-wishlist">
    <div class="searchbar">
      <span class="mag">🔍</span>
      <input id="wishSearch" placeholder="Search your wish list…" autocomplete="off">
    </div>
    <div id="wishList"></div>
  </section>

  <!-- ===== FIND ===== -->
  <section class="view" id="view-find">
    <div class="searchbar">
      <span class="mag">🔍</span>
      <input id="findSearch" placeholder="Search any book by title or author…" autocomplete="off">
    </div>
    <div id="findResults">
      <div class="empty">
        <div class="big">🌎</div>
        <div>Search for any book in the world.<br>Add it to your Library or Wish List!</div>
      </div>
    </div>
  </section>

  <!-- ===== SERIES ===== -->
  <section class="view" id="view-series">
    <button class="btn gold" id="newSeriesBtn" style="margin-bottom:12px">➕ Start a New Series</button>
    <button class="btn ghost sm" id="trashBtnSer" style="width:100%;margin-bottom:12px;display:none">🗑️ Recently Deleted</button>
    <div id="seriesList"></div>
  </section>

  <div class="credit">Made with ❤️ by <b>Mason Teibel</b> · <span id="verTag">v28</span></div>
</main>

<nav>
  <button data-view="library" class="active"><span class="ic">📚</span>Library</button>
  <button data-view="scan"><span class="ic">📷</span>Scan</button>
  <button data-view="series"><span class="ic">🔖</span>Series</button>
  <button data-view="wishlist"><span class="ic">⭐</span>Wishes</button>
  <button data-view="find"><span class="ic">🔍</span>Find</button>
</nav>

<!-- ===== Book detail sheet ===== -->
<div class="modal" id="detailModal">
  <div class="sheetwrap">
    <button class="sheetback" id="sheetBackBtn" onclick="handleBack()">← Back</button>
    <div class="sheet" id="detailSheet"></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* =======================================================================
   Mason's Book Nook  —  Made by Mason Teibel
   A single-file digital library:  scan • save • search • wish list
   ======================================================================= */

const LS_LIB = 'mbn_library';
const LS_WISH = 'mbn_wishlist';
const LS_SER = 'mbn_series';
const LS_TRASH = 'mbn_trash';

let library  = load(LS_LIB);
let wishlist = load(LS_WISH);
let seriesSets = load(LS_SER);
let trash = load(LS_TRASH);   // recently deleted: [{tid, kind:'lib'|'wish'|'series', data, when}]

const TRASH_MAX_AGE = 5 * 24 * 60 * 60 * 1000;   // deleted items clear after 5 days
function purgeOldTrash(){
  const cutoff = Date.now() - TRASH_MAX_AGE;
  const before = trash.length;
  trash = trash.filter(t => (t.when || 0) >= cutoff);
  if(trash.length !== before){ try{ localStorage.setItem(LS_TRASH, JSON.stringify(trash)); }catch(e){} }
}
function daysLeftInTrash(when){
  const ms = (when || 0) + TRASH_MAX_AGE - Date.now();
  return Math.max(0, Math.ceil(ms / (24*60*60*1000)));
}
purgeOldTrash();

function load(k){ try{ return JSON.parse(localStorage.getItem(k)) || []; }catch(e){ return []; } }
function save(){
  localStorage.setItem(LS_LIB, JSON.stringify(library));
  localStorage.setItem(LS_WISH, JSON.stringify(wishlist));
  localStorage.setItem(LS_SER, JSON.stringify(seriesSets));
  localStorage.setItem(LS_TRASH, JSON.stringify(trash));
  updateCount();
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

/* ---- Share a library with friends (via a link — no server needed) ---- */
function copyText(txt){
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt); return true; } }catch(e){}
  try{ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); return true; }catch(e){}
  return false;
}
function makeShareLink(){
  const mini = library.map(b=>({t:b.title, a:b.author, y:b.year, g:b.genre, s:b.series, i:b.isbn}));
  const json = JSON.stringify({ v:1, books:mini });
  const code = encodeURIComponent(btoa(unescape(encodeURIComponent(json))));
  return location.origin + location.pathname + '#lib=' + code;
}
async function shareLibrary(){
  if(!library.length){ toast('Add some books first, then share!'); return; }
  const url = makeShareLink();
  try{
    if(navigator.share){ await navigator.share({ title:"My Book Nook library", text:"Here are the books in my library! Open this to see them:", url }); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  const ok = copyText(url);
  showShareSheet(url, ok);
}
function showShareSheet(url, copied){
  const sheet=document.getElementById('detailSheet');
  sheet.innerHTML = `<div class="grip"></div>
    <div style="text-align:center;padding:8px 4px 2px">
      <div style="font-size:46px">👥</div>
      <h2 style="margin:10px 0 8px">Share your library</h2>
      <p style="color:var(--muted);margin:0 0 14px">${copied?'Link copied! ✓ Paste it in a text or chat to a friend.':'Copy this link and send it to a friend:'}</p>
    </div>
    <div class="field"><input id="shareUrl" readonly value="${escapeHtml(url)}" onclick="this.select()"></div>
    <button class="btn" onclick="if(copyText(document.getElementById('shareUrl').value)) toast('Copied ✓')">📋 Copy link</button>
    <button class="btn ghost" style="margin-top:10px" onclick="closeDetail()">Done</button>`;
  showModal();
}

/* Someone opened a shared link — show their books to add */
function checkSharedLink(){
  const m = (location.hash||'').match(/lib=([^&]+)/);
  if(!m) return;
  try{
    const json = decodeURIComponent(escape(atob(decodeURIComponent(m[1]))));
    const payload = JSON.parse(json);
    if(payload && Array.isArray(payload.books)){
      const books = payload.books.map(x=>({ title:x.t, author:x.a, year:x.y, genre:x.g, series:x.s, isbn:x.i }));
      history.replaceState(null, '', location.pathname);   // clean the address bar
      showSharedLibrary(books);
    }
  }catch(e){}
}
function showSharedLibrary(books){
  window._shared = books;
  const rows = books.map((b,i)=>{
    const have = inLibrary(b);
    return `<div class="book" style="cursor:default">
        ${coverHtml(b)}
        <div class="binfo">
          <div class="t">${escapeHtml(b.title||'Untitled')}</div>
          <div class="a">${escapeHtml(b.author||'Unknown author')}</div>
          <div class="tags">${b.series?`<span class="tag series">📚 ${escapeHtml(b.series)}</span>`:''}${b.genre?`<span class="tag">${escapeHtml(b.genre)}</span>`:''}</div>
        </div>
        <button class="miniadd ${have?'have':'lib'}" onclick="addSharedBook(${i}, this)">${have?'✓ Have it':'＋ Add'}</button>
      </div>`;
  }).join('');
  const sheet=document.getElementById('detailSheet');
  sheet.innerHTML = `<div class="grip"></div>
    <h2 style="text-align:center;margin:2px 0 4px">👥 Shared Library</h2>
    <p style="text-align:center;color:var(--muted);margin:0 0 12px">A friend shared ${books.length} book${books.length===1?'':'s'} with you. Add any you want!</p>
    <button class="btn gold" style="margin-bottom:12px" onclick="addAllShared()">➕ Add all to my Library</button>
    ${rows}
    <button class="btn ghost" style="margin-top:12px" onclick="closeDetail()">Close</button>`;
  showModal();
}
function addSharedBook(i, btn){
  const b = window._shared && window._shared[i]; if(!b) return;
  if(addToLibrary({...b})){ if(btn){ btn.className='miniadd have'; btn.textContent='✓ Have it'; } }
}
function addAllShared(){
  const books = window._shared || [];
  let n=0; books.forEach(b=>{ if(addToLibrary({...b}, true)) n++; });
  renderAll();
  toast(n ? `Added ${n} book${n===1?'':'s'} 📚` : 'You already have those');
  closeDetail();
}

/* ---------- Recently Deleted (undo / restore) ---------- */
function pushTrash(kind, data){
  const tid = uid();
  trash.push({ tid, kind, data, when: Date.now() });
  if(trash.length > 50) trash = trash.slice(trash.length - 50);
  return tid;
}
function restoreItem(tid){
  const i = trash.findIndex(t=>t.tid===tid); if(i<0) return;
  const it = trash[i];
  if(it.kind==='series'){ if(!seriesSets.some(s=>s.id===it.data.id)) seriesSets.push(it.data); }
  else { const arr = it.kind==='wish' ? wishlist : library; if(!arr.some(b=>b.id===it.data.id)) arr.push(it.data); }
  trash.splice(i,1); save(); renderAll();
  hideToast();
  if(document.getElementById('detailModal').classList.contains('show')) showTrash();
  toast('Brought it back ✓');
}
function updateTrashButtons(){
  purgeOldTrash();
  const n = trash.length;
  ['trashBtnLib','trashBtnSer'].forEach(id=>{
    const el = document.getElementById(id); if(!el) return;
    el.style.display = n ? 'block' : 'none';
    el.textContent = `🗑️ Recently Deleted (${n})`;
  });
}
function showTrash(){
  purgeOldTrash();
  const sheet = document.getElementById('detailSheet');
  if(!trash.length){
    sheet.innerHTML = `<div class="grip"></div>
      <div class="empty"><div class="big">🗑️</div><div>Nothing here. Deleted books and series show up here so you can bring them back.</div></div>
      <button class="btn ghost" onclick="closeDetail()">Close</button>`;
    showModal(); return;
  }
  const items = trash.slice().sort((a,b)=>b.when-a.when);
  const rows = items.map(it=>{
    const name = it.kind==='series' ? ('🔖 '+it.data.name) : it.data.title;
    const label = it.kind==='series' ? 'series' : (it.kind==='wish' ? 'wish list' : 'library');
    const left = daysLeftInTrash(it.when);
    const clearTxt = left<=0 ? 'Clears very soon'
                   : (left===1 ? 'Clears in 1 day' : `Clears in ${left} days`);
    const clearColor = left<=1 ? '#d63384' : 'var(--muted)';
    return `<div class="genrerow" style="cursor:default">
        <span style="min-width:0">
          <div style="font-weight:700;word-break:break-word">${escapeHtml(name)}</div>
          <div style="font-size:12px;color:var(--muted)">was in ${label}</div>
          <div style="font-size:12px;font-weight:700;color:${clearColor}">⏳ ${clearTxt}</div>
        </span>
        <button class="miniadd lib" style="flex:0 0 auto" onclick="restoreItem('${it.tid}')">↩️ Bring back</button>
      </div>`;
  }).join('');
  sheet.innerHTML = `<div class="grip"></div>
    <h2 style="text-align:center;margin:2px 0 4px">🗑️ Recently Deleted</h2>
    <p style="text-align:center;color:var(--muted);margin:0 0 14px">Deleted books clear on their own after 5 days. Tap "Bring back" to restore. Newest first.</p>
    ${rows}
    <button class="btn ghost" style="margin-top:12px" onclick="closeDetail()">Close</button>`;
  showModal();
}

/* ---------- helpers ---------- */
function sortKey(title){ return (title||'').toLowerCase().replace(/^(the|a|an)\s+/,'').trim(); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t=document.getElementById('toast'); t.style.pointerEvents='none'; t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1900); }
function hideToast(){ const t=document.getElementById('toast'); t.classList.remove('show'); t.style.pointerEvents='none'; }
function showUndoToast(msg, tid){
  const t=document.getElementById('toast');
  t.innerHTML = `${escapeHtml(msg)} &nbsp;<span id="undoBtn" style="text-decoration:underline;font-weight:800">↩️ Undo</span>`;
  t.style.pointerEvents='auto'; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>{ t.classList.remove('show'); t.style.pointerEvents='none'; }, 6000);
  const u=document.getElementById('undoBtn'); if(u) u.onclick=()=>restoreItem(tid);
}
function coverHtml(b){
  if(b.cover) return `<img src="${b.cover}" class="cover" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'cover',textContent:'📖'}))">`;
  return `<div class="cover">📖</div>`;
}
function inLibrary(book){ return library.some(b => sameBook(b,book)); }
function inWish(book){ return wishlist.some(b => sameBook(b,book)); }
function sameBook(a,b){
  if(a.isbn && b.isbn) return a.isbn===b.isbn;
  return sortKey(a.title)===sortKey(b.title) && (a.author||'').toLowerCase()===(b.author||'').toLowerCase();
}

function updateCount(){
  document.getElementById('hcount').textContent =
    `${library.length} book${library.length===1?'':'s'} · ${wishlist.length} on wish list`;
  const nEl = document.getElementById('libCountNum');
  if(nEl) nEl.textContent = library.length;
  const lEl = document.getElementById('libCountLbl');
  if(lEl) lEl.textContent = library.length===1 ? 'book scanned' : 'books scanned';
}

/* =======================================================================
   LIBRARY  —  alphabetical list + search + genre/series filters
   ======================================================================= */
const libSearch = document.getElementById('libSearch');
const genreFilter = document.getElementById('genreFilter');
const seriesFilter = document.getElementById('seriesFilter');
[libSearch, genreFilter, seriesFilter].forEach(el=>el.addEventListener('input', renderLibrary));

function refreshFilters(){
  const genres = [...new Set(library.map(b=>b.genre).filter(Boolean))].sort();
  const series = [...new Set(library.map(b=>b.series).filter(Boolean))].sort();
  const hasNoGenre = library.some(b=>!(b.genre||'').trim());
  const keepG = genreFilter.value, keepS = seriesFilter.value;
  genreFilter.innerHTML = '<option value="">All genres</option>'
    + genres.map(g=>`<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join('')
    + (hasNoGenre ? '<option value="__none__">No genre yet</option>' : '');
  seriesFilter.innerHTML = '<option value="">All series</option>' + series.map(s=>`<option>${escapeHtml(s)}</option>`).join('');
  if(genres.includes(keepG) || keepG==='__none__') genreFilter.value = keepG;
  if(series.includes(keepS)) seriesFilter.value = keepS;
}

function renderLibrary(){
  refreshFilters();
  const q = libSearch.value.trim().toLowerCase();
  const gf = genreFilter.value, sf = seriesFilter.value;
  const list = document.getElementById('libList');

  let books = library.filter(b=>{
    if(gf){ if(gf==='__none__'){ if((b.genre||'').trim()) return false; } else if(b.genre!==gf) return false; }
    if(sf && b.series!==sf) return false;
    if(q){
      const hay = `${b.title} ${b.author} ${b.genre} ${b.series}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  books.sort((a,b)=> sortKey(a.title).localeCompare(sortKey(b.title)));

  if(!library.length){
    list.innerHTML = `<div class="empty"><div class="big">📚</div>
      <div>Your library is empty.<br>Tap <span class="btnlink" onclick="goTo('scan')">📷 Scan</span> to add your first book!</div></div>`;
    return;
  }
  if(!books.length){ list.innerHTML = `<div class="empty"><div class="big">🔎</div><div>No books match that.</div></div>`; return; }

  let html = '', lastLetter = '';
  books.forEach(b=>{
    const L = (sortKey(b.title)[0]||'#').toUpperCase();
    if(L!==lastLetter){ html += `<div class="letter">${L}</div>`; lastLetter = L; }
    html += bookCard(b);
  });
  list.innerHTML = html;
}

const NONE_GENRE = 'No genre yet';
document.getElementById('genreListBtn').addEventListener('click', showGenreList);

function showGenreList(){
  const sheet = document.getElementById('detailSheet');

  if(counts[NONE_GENRE]) genres.push(NONE_GENRE);

function filterByGenre(g){

  else if(g===NONE_GENRE) genreFilter.value = '__none__';
  else genreFilter.value = g;
  renderLibrary();
  closeDetail();
  goTo('library');
  document.querySelector('main').scrollTo(0,0);
  toast(g==='__all__' ? 'Showing all books' : `Showing: ${g}`);
}

function bookCard(b){
  const tags = [];
  if(b.series) tags.push(`<span class="tag series">📚 ${escapeHtml(b.series)}</span>`);
  if(b.genre)  tags.push(`<span class="tag">${escapeHtml(b.genre)}</span>`);

  return `<div class="book" onclick="openDetail('${b.id}','lib')">
      ${coverHtml(b)}

        <div class="t">${escapeHtml(b.title)}</div>
        <div class="a">${escapeHtml(b.author||'Unknown author')}</div>
        <div class="tags">${tags.join('')}</div>

}

   DETAIL SHEET  —  view / edit / move / delete

const detailModal = document.getElementById('detailModal');
detailModal.addEventListener('click', e=>{ if(e.target===detailModal) closeDetail(); });

/* ---- Modal + Back-button navigation ----
   showModal(backFn): open the sheet; the ← Back button (and the phone's back
   button) run backFn — or just close if none is given. */
let currentBack = null, mbnPushed = false, suppressPop = false;
function showModal(backFn){
  currentBack = backFn || closeDetail;
  const wasClosed = !detailModal.classList.contains('show');
  detailModal.classList.add('show');
  if(wasClosed && !mbnPushed){ mbnPushed = true; try{ history.pushState({mbnModal:1}, ''); }catch(e){} }
}
function handleBack(){ (currentBack || closeDetail)(); }
function closeDetail(){
  if(!detailModal.classList.contains('show')) return;
  detailModal.classList.remove('show');
  currentBack = null;
  if(mbnPushed){ mbnPushed = false; suppressPop = true; try{ history.back(); }catch(e){} }
}
/* The phone's hardware Back button */
window.addEventListener('popstate', ()=>{
  if(suppressPop){ suppressPop = false; return; }
  if(detailModal.classList.contains('show')){ mbnPushed = false; detailModal.classList.remove('show'); currentBack = null; }
});

function openDetail(id, where){
  const arr = where==='lib' ? library : wishlist;
  const b = arr.find(x=>x.id===id);
  if(!b) return;
  const sheet = document.getElementById('detailSheet');
  const row = (icon,label,val)=> val ? `<div class="inforow"><span class="ik">${icon} ${label}</span><span class="iv">${escapeHtml(String(val))}</span></div>` : '';
  const noInfo = !b.year && !b.genre && !b.series;
  sheet.innerHTML = `
    <div class="grip"></div>
    <div class="bookpage">
      ${coverHtml(b)}
      <h2 class="bp-title">${escapeHtml(b.title)}</h2>
      <div class="bp-author">by ${escapeHtml(b.author||'Unknown author')}</div>
    </div>
    <div class="infobox">
      ${row('📅','Year made', b.year)}
      ${row('🏷️','Genre', b.genre)}
      ${row('🔖','Series', b.series)}
      ${noInfo ? '<div class="inforow"><span class="ik" style="color:var(--muted)">No extra info yet — tap Edit to add some</span></div>' : ''}
    </div>
    <button class="btn ghost" onclick="editDetail('${id}','${where}')">✏️ Edit details</button>
    <div class="btnrow">
      ${where==='lib'
        ? `<button class="btn wish" onclick="moveBook('${id}','lib','wish')">⭐ Move to Wish List</button>`
        : `<button class="btn" onclick="moveBook('${id}','wish','lib')">📚 I got it! Add to Library</button>`}
    </div>
    <div class="btnrow">
      <button class="btn danger" onclick="askDelete('${id}','${where}')">🗑️ Remove</button>
      <button class="btn ghost" onclick="closeDetail()">Close</button>
    </div>
  `;
  showModal();
}

/* The edit form (reached from the book page's ✏️ Edit button) */
function editDetail(id, where){
  const arr = where==='lib' ? library : wishlist;
  const b = arr.find(x=>x.id===id); if(!b) return;
  const sheet = document.getElementById('detailSheet');
  sheet.innerHTML = `
    <div class="grip"></div>
    <h2 style="text-align:center;margin:2px 0 14px">✏️ Edit Book</h2>
    <div class="field"><label>Title</label><input id="d_title" value="${escapeHtml(b.title)}"></div>
    <div class="field"><label>Author</label><input id="d_author" value="${escapeHtml(b.author||'')}"></div>
    <div class="field"><label>Year Made</label><input id="d_year" value="${escapeHtml(String(b.year||''))}"></div>
    <div class="field"><label>Genre</label><input id="d_genre" value="${escapeHtml(b.genre||'')}"></div>
    <div class="field"><label>Series</label><input id="d_series" value="${escapeHtml(b.series||'')}"></div>
    <button class="btn" onclick="saveEdits('${id}','${where}')">💾 Save changes</button>
    <button class="btn ghost" style="margin-top:10px" onclick="openDetail('${id}','${where}')">Cancel</button>
  `;
  showModal(()=>openDetail(id, where));
}

function saveEdits(id, where){
  const arr = where==='lib' ? library : wishlist;
  const b = arr.find(x=>x.id===id); if(!b) return;
  b.title  = document.getElementById('d_title').value.trim() || b.title;
  b.author = document.getElementById('d_author').value.trim();
  b.year   = document.getElementById('d_year').value.trim();
  b.genre  = document.getElementById('d_genre').value.trim();
  b.series = document.getElementById('d_series').value.trim();
  save(); renderAll(); openDetail(id, where); toast('Saved ✓');
}
function moveBook(id, from, to){
  const src = from==='lib' ? library : wishlist;
  const dst = to==='lib' ? library : wishlist;
  const i = src.findIndex(x=>x.id===id); if(i<0) return;
  const [b] = src.splice(i,1);
  dst.push(b);
  save(); renderAll(); closeDetail();
  toast(to==='lib' ? 'Added to your Library 📚' : 'Moved to Wish List ⭐');
}
function askDelete(id, where){
  const arr = where==='lib' ? library : wishlist;
  const b = arr.find(x=>x.id===id); if(!b) return;
  const spot = where==='lib' ? 'Library' : 'Wish List';
  const sheet = document.getElementById('detailSheet');
  sheet.innerHTML = `
    <div class="grip"></div>
    <div style="text-align:center;padding:6px 4px 2px">
      <div style="font-size:48px">🗑️</div>
      <h2 style="margin:12px 0 8px">Remove this book?</h2>
      <p style="color:var(--ink);font-weight:600;margin:0 0 6px">“${escapeHtml(b.title)}”</p>
      <p style="color:var(--muted);margin:0 0 20px">will be taken out of your ${spot}.<br>You can always add it again later.</p>
    </div>
    <button class="btn danger" onclick="deleteBook('${id}','${where}')">Yes, remove it</button>
    <button class="btn ghost" style="margin-top:10px" onclick="openDetail('${id}','${where}')">↩️ No, keep it</button>
  `;
  showModal(()=>openDetail(id, where));
}
function deleteBook(id, where){
  const arr = where==='lib' ? library : wishlist;
  const i = arr.findIndex(x=>x.id===id); if(i<0) return;
  const [b] = arr.splice(i,1);
  const tid = pushTrash(where, b);
  save(); renderAll(); closeDetail();
  showUndoToast(`Removed "${b.title}"`, tid);
}

/* =======================================================================
   ADDING BOOKS
   ======================================================================= */
function addToLibrary(book, silent){
  if(inLibrary(book)){ if(!silent) toast('Already in your library'); return false; }
  library.push({...book, id: uid(), dateAdded: Date.now()});
  save(); renderAll();
  if(!silent) toast(`Added "${book.title}" 📚`);
  // Run after the current click finishes (so the scan sheet closes first, then the series prompt opens).
  if(!silent) setTimeout(()=>maybeBuildSeries(book), 0);
  return true;
}

/* After a book is added: if it belongs to a series, ASK before adding the series.
   (If that series already exists, just check this book off — no need to ask again.) */
async function maybeBuildSeries(book){
  let name = String(book.series||'').trim();
  if(!name){ try{ name = await detectSeriesName(book); }catch(e){} }
  if(!name) return;
  const existing = seriesSets.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(existing){ ensureSeriesFromBook({ ...book, series: name }); return; }
  askAddSeries(book, name);
}

function askAddSeries(book, name){
  window._pendingSeries = { book, name };
  const sheet = document.getElementById('detailSheet');
  sheet.innerHTML = `<div class="grip"></div>
    <div style="text-align:center;padding:6px 4px 2px">
      <div style="font-size:46px">🔖</div>
      <h2 style="margin:10px 0 8px">Add this series?</h2>
      <p style="margin:0 0 4px">“${escapeHtml(book.title)}” is part of the</p>
      <p style="font-weight:800;color:var(--brand);font-size:20px;margin:0 0 12px">${escapeHtml(name)}</p>
      <p style="color:var(--muted);margin:0 0 20px">Want a checklist of the whole series?<br>I'll add the books and check off the ones you have.</p>
    </div>
    <button class="btn" onclick="confirmBuildSeries()">🔖 Yes, add the series</button>
    <button class="btn ghost" style="margin-top:10px" onclick="closeDetail()">No thanks</button>`;
  showModal();
}
function confirmBuildSeries(){
  const p = window._pendingSeries; if(!p){ closeDetail(); return; }
  window._pendingSeries = null;
  ensureSeriesFromBook({ ...p.book, series: p.name });
  closeDetail();
  goTo('series');
}

/* Look up which series a book belongs to, by finding its work record online.
   Only trusts a match whose title is really the same book. */
async function detectSeriesName(book){
  const title = book.title||''; if(!title) return '';
  const q = title + (book.author ? ' ' + book.author : '');
  try{
    const r = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&language=eng&limit=5&fields=title,key`);
    if(r.ok){
      const j = await r.json();
      for(const d of (j.docs||[])){
        if(!d.key || normTitle(d.title)!==normTitle(title)) continue;
        const w = await (await fetch(`https://openlibrary.org${d.key}.json`)).json();
        const name = await seriesNameFromWork(w);
        if(name) return name;
      }
    }
  }catch(e){}
  return '';
}

/* When you add a book that belongs to a series, make sure that whole series
   exists in the 🔖 Series section (and fill in the other books). */
function ensureSeriesFromBook(book){
  const name = String(book.series||'').trim();
  if(!name) return;
  let s = seriesSets.find(x=>x.name.toLowerCase()===name.toLowerCase());
  const isNew = !s;
  if(isNew){ s = { id: uid(), name, books: [] }; seriesSets.push(s); }
  // make sure the book you just added is in the series and checked off
  if(!s.books.some(b=>normTitle(b.title)===normTitle(book.title))){
    s.books.push({ title: book.title, have: true });
  }
  save(); renderSeries();
  if(isNew){
    toast(`Started the “${name}” series 🔖`);
    populateSeriesBooks(s.id, name);   // fill in the rest in the background
  }
}

/* Best-effort: look up the other English books in a series and add them. */
async function populateSeriesBooks(seriesId, name){
  const s = getSeries(seriesId); if(!s) return;
  let titles = [];
  try{
    const r = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(name)}&language=eng&limit=30&fields=title`);
    if(r.ok){ const j = await r.json(); titles = (j.docs||[]).map(d=>d.title).filter(isLatinTitle); }
  }catch(e){}
  const seen = new Set(s.books.map(b=>normTitle(b.title)));
  let added = 0;
  for(const t of titles){
    const k = normTitle(t);
    if(k && !seen.has(k)){ seen.add(k); s.books.push({ title:t, have: ownsTitle(t) }); added++; }
    if(added >= 12) break;   // keep the list sensible; noisy searches don't flood it
  }
  save(); renderSeries();
}
function addToWish(book){
  if(inWish(book)){ toast('Already on your wish list'); return false; }
  wishlist.push({...book, id: uid(), dateAdded: Date.now()});
  save(); renderAll(); toast(`Added to wish list ⭐`);
  return true;
}

/* =======================================================================
   BOOK LOOKUP  (Google Books primary, Open Library for series)
   ======================================================================= */
async function lookupISBN(isbn){
  isbn = (isbn||'').replace(/[^0-9Xx]/g,'');
  if(isbn.length < 10) return null;
  let book = null;

  // 1) Open Library edition record (reliable, no key, no rate limit) — best for series
  try{
    const r2 = await fetch(`https://openlibrary.org/isbn/${isbn}.json`);
    if(r2.ok){
      const ed = await r2.json();
      book = { isbn, title: ed.title||'Unknown title', author:'',
               year: (ed.publish_date||'').match(/\d{4}/)?.[0]||'',
               genre:'', series:'', cover:`https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg` };
      if(ed.series && ed.series[0]) book.series = cleanSeries(ed.series[0]);
      if(ed.subjects) book.genre = pickGenre(ed.subjects);
      if(ed.authors && ed.authors[0]){
        try{ const a = await (await fetch(`https://openlibrary.org${ed.authors[0].key}.json`)).json(); book.author = a.name||''; }catch(e){}
      }
      // The WORK record holds the series AND the English title — follow it when
      // we need the series, or when this edition's title isn't in English.
      if(ed.works && ed.works[0] && (!book.series || !isLatinTitle(book.title))){
        try{
          const w = await (await fetch(`https://openlibrary.org${ed.works[0].key}.json`)).json();
          if(!book.series) book.series = await seriesNameFromWork(w);
          if(!book.genre && w.subjects) book.genre = pickGenre(w.subjects);
          // Prefer the English work title when this edition's title is another language
          if(w.title && !isLatinTitle(book.title) && isLatinTitle(w.title)) book.title = w.title;
        }catch(e){}
      }
    }
  }catch(e){}

  // 2) Google Books fills any gaps (author/genre/cover) — may be rate-limited, that's OK
  if(!book || !book.author || !book.genre){
    try{
      const r = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
      if(r.ok){
        const j = await r.json();
        if(j.items && j.items.length){
          const g = fromGoogle(j.items[0], isbn);
          if(!book) book = g;
          else { book.author = book.author||g.author; book.genre = book.genre||g.genre; book.year = book.year||g.year; if(!book.cover) book.cover = g.cover; }
        }
      }
    }catch(e){}
  }

  return book || null;
}

/* Look up a book from ANY barcode on it — the 978 book barcode OR a regular
   store (UPC) barcode that some paperbacks use instead. */
async function lookupAnyCode(raw){
  const code = String(raw||'').replace(/[^0-9Xx]/g,'');
  if(code.length < 8) return null;
  const isIsbn = (code.length===13 && /^97[89]/.test(code)) || code.length===10;
  let book = null;
  if(isIsbn) book = await lookupISBN(code);
  if(!book) book = await searchByCode(code);        // UPC / store barcode, or an ISBN that missed
  if(!book && !isIsbn) book = await lookupISBN(code); // last resort
  return book;
}

/* Search for a book by an arbitrary barcode number (used for UPC / non-ISBN codes) */
async function searchByCode(code){
  try{
    const r = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(code)}&maxResults=1&langRestrict=en`);
    if(r.ok){ const j = await r.json(); if(j.items && j.items.length) return fromGoogle(j.items[0]); }
  }catch(e){}
  try{
    const r = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(code)}&language=eng&limit=1&fields=title,author_name,first_publish_year,cover_i,isbn,subject`);
    if(r.ok){ const j = await r.json(); if(j.docs && j.docs.length) return fromOpenLibDoc(j.docs[0]); }
  }catch(e){}
  return null;
}

function fromGoogle(item, isbn){
  const v = item.volumeInfo || {};
  return {
    isbn: isbn || (v.industryIdentifiers?.find(x=>/ISBN/.test(x.type))?.identifier) || '',
    title: v.title + (v.subtitle ? '' : ''),
    author: (v.authors||[]).join(', '),
    year: (v.publishedDate||'').match(/\d{4}/)?.[0] || '',
    genre: cleanGenre((v.categories||[])[0] || ''),
    series: '',
    cover: v.imageLinks ? (v.imageLinks.thumbnail||v.imageLinks.smallThumbnail||'').replace('http://','https://') : ''
  };
}
function cleanGenre(g){
  if(!g) return '';
  g = String(g).split('/')[0].split(',')[0].trim();
  g = g.replace(/[_:]/g,' ').replace(/\s+/g,' ').trim();
  if(g.length>26) g = g.slice(0,26);
  // Title-case for a tidy look
  return g.replace(/\b\w/g, c=>c.toUpperCase());
}
// Pick the nicest genre from a list of Open Library subjects
function pickGenre(subjects){
  if(!subjects || !subjects.length) return '';
  const bad = /series|character|accessible|large type|protected|in library|nyt:|:|reading level|spanish|award/i;
  const cand = subjects.find(s => s && !bad.test(s) && !/\d/.test(s) && s.length<=26) || '';
  return cleanGenre(cand);
}
function cleanSeries(s){
  // Open Library series like "Harry Potter ; 1"  ->  "Harry Potter"
  return String(s).split(/[;#(]/)[0].replace(/\s+\d+\s*$/,'').trim();
}
/* A work's series can be a plain string, or {position, series:{key}} pointing
   at a series record whose .name we fetch. Returns a clean series name or ''. */
async function seriesNameFromWork(w){
  const s = w && w.series && w.series[0];
  if(!s) return '';
  if(typeof s === 'string') return cleanSeries(s);
  if(s.series && s.series.key){
    try{
      const sr = await (await fetch(`https://openlibrary.org${s.series.key}.json`)).json();
      return cleanSeries(sr.name||'');
    }catch(e){}
  }
  return '';
}

/* Find the English title for a book's ISBN (edition title, else the work title). */
async function fetchEnglishTitle(isbn){
  isbn = (isbn||'').replace(/[^0-9Xx]/g,''); if(isbn.length<10) return '';
  try{
    const ed = await (await fetch(`https://openlibrary.org/isbn/${isbn}.json`)).json();
    if(isLatinTitle(ed.title)) return ed.title;
    if(ed.works && ed.works[0]){
      const w = await (await fetch(`https://openlibrary.org${ed.works[0].key}.json`)).json();
      if(isLatinTitle(w.title)) return w.title;
    }
  }catch(e){}
  return '';
}

/* Background pass: turn any non-English book title in the Library/Wish List into
   English. Runs quietly on load; does nothing if everything is already English. */
async function fixNonEnglishTitles(){
  const targets = [...library, ...wishlist].filter(b => b.isbn && b.title && !isLatinTitle(b.title));
  if(!targets.length) return;
  let changed = false, n = 0;
  for(const b of targets){
    if(n++ > 20) break;
    const eng = await fetchEnglishTitle(b.isbn);
    if(eng && isLatinTitle(eng) && eng !== b.title){ b.title = eng; changed = true; }
  }
  if(changed){ save(); renderAll(); }
}

/* =======================================================================
   CAMERA + BARCODE SCANNING
   Works two ways so it runs on as many phones as possible:
     A) native BarcodeDetector  (Chrome on Android)
     B) ZXing library fallback  (other browsers / iPhone Safari)
   ======================================================================= */
let stream=null, detector=null, scanning=false, rafId=null, lastCode=null, lastTime=0;
let zxingReader=null, usingZXing=false, zxingLoading=null;
const video = document.getElementById('scanVideo');
const scanToggle = document.getElementById('scanToggle');
const scanHint = document.getElementById('scanHint');

scanToggle.addEventListener('click', ()=>{ scanning ? stopCamera() : startCamera(); });

/* Plain-language camera self-check so we can see what's wrong on a real phone. */
const APP_VERSION = 'v28';
document.getElementById('diagBtn').addEventListener('click', runCameraCheck);
async function runCameraCheck(){
  const box = document.getElementById('scanDiag');
  box.innerHTML = `<div class="loading"><div class="spinner"></div>Checking…</div>`;
  const lines = [];
  const yn = b => b ? '✅ yes' : '❌ NO';
  lines.push(['App version', APP_VERSION]);
  lines.push(['Secure (https)', location.protocol==='https:' ? '✅ yes' : '❌ NO']);
  lines.push(['Browser can use camera', yn(!!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia))]);
  lines.push(['Built-in scanner', ('BarcodeDetector' in window) ? '✅ yes' : '➖ no (uses backup)']);

  let perm = 'unknown';
  try{ if(navigator.permissions && navigator.permissions.query){ perm = (await navigator.permissions.query({name:'camera'})).state; } }catch(e){}
  lines.push(['Camera permission', perm]);

  let openResult = '';
  try{
    const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    s.getTracks().forEach(t=>t.stop());
    openResult = '✅ CAMERA OPENS!';
  }catch(e){ openResult = '❌ FAILED (' + (e && e.name || 'error') + ')'; }
  lines.push(['Open camera test', openResult]);

  const standalone = window.matchMedia('(display-mode: standalone)').matches;
  lines.push(['Opened as', standalone ? 'installed app' : 'browser tab']);
  const ua = navigator.userAgent;
  let browser = 'other';
  if(/SamsungBrowser/.test(ua)) browser = 'Samsung Internet';
  else if(/Chrome\//.test(ua) && !/wv\)/.test(ua)) browser = 'Chrome';
  else if(/wv\)/.test(ua)) browser = 'in-app browser (WebView)';
  else if(/CriOS/.test(ua)) browser = 'Chrome (iPhone)';
  else if(/Safari/.test(ua)) browser = 'Safari';
  lines.push(['Browser', browser]);

  box.innerHTML = `<div style="background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;margin-top:12px">
      <div style="font-weight:800;color:var(--brand);margin-bottom:8px">Camera Check 🔧</div>
      ${lines.map(([k,v])=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line);font-size:14px"><span style="color:var(--muted)">${k}</span><span style="font-weight:700;text-align:right">${escapeHtml(String(v))}</span></div>`).join('')}
      <div style="color:var(--muted);font-size:12px;margin-top:10px">Read these lines to whoever is helping you 🙂</div>
    </div>`;
}

function hint(msg){ scanHint.textContent = msg; }

// Book barcodes are EAN-13. Only ask for formats the device actually supports.
const WANTED_FORMATS = ['ean_13','ean_8','upc_a','upc_e','qr_code','code_128'];
async function makeDetector(){
  let formats = WANTED_FORMATS;
  try{
    if(BarcodeDetector.getSupportedFormats){
      const sup = await BarcodeDetector.getSupportedFormats();
      formats = WANTED_FORMATS.filter(f => sup.includes(f));
    }
  }catch(e){ formats = null; }
  if(formats && !formats.length) return null;        // device supports no useful formats
  return formats ? new BarcodeDetector({formats}) : new BarcodeDetector();
}

function looksBlocked(err){
  const n = (err && err.name) || '';
  const m = ((err && err.message) || '').toLowerCase();
  return n==='NotAllowedError' || n==='SecurityError' ||
         /permission|denied|not allowed|gesture|dismiss/.test(m);
}
function cameraErrorMessage(err){
  const n = (err && err.name) || '';
  if(looksBlocked(err))
    return '📷 Camera permission is off. In Chrome: tap the ⋮ menu → tap the 🔒/ⓘ by the web address → Permissions → turn Camera ON. Then tap Start Camera again.';
  if(n==='NotFoundError' || n==='DevicesNotFoundError' || n==='OverconstrainedError')
    return 'No usable camera was found. You can still type the ISBN number below.';
  if(n==='NotReadableError' || n==='TrackStartError' || n==='AbortError')
    return 'The camera is busy in another app. Close other camera apps, then try again.';
  if(location.protocol!=='https:' && location.hostname!=='localhost')
    return 'The camera only works on the online (https) version. Open the app link, not a saved file.';
  return 'Could not open the camera. Tap Start Camera once more, or type the ISBN below.';
}

async function startCamera(){
  hint('Starting camera…');
  scanToggle.textContent = '⏳ Opening…';

  // ---- Path A: native BarcodeDetector (fast; Chrome on Android) ----
  if('BarcodeDetector' in window){
    let det=null;
    try{ det = await makeDetector(); }catch(e){ det=null; }
    if(det){
      detector = det;
      try{
        stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
        video.srcObject = stream; await video.play();
        usingZXing = false; scanning = true;
        scanToggle.textContent = '⏹️ Stop Camera';
        hint('Point at the barcode and hold steady…');
        scanLoop();
        return;
      }catch(e){
        // Permission/hardware error — report it (don't silently fall through and re-prompt)
        stopCamera(); hint(cameraErrorMessage(e)); return;
      }
    }
  }

  // ---- Path B: ZXing fallback (iPhone Safari, older browsers) ----
  try{
    await ensureZXing();
    zxingReader = zxingReader || new ZXing.BrowserMultiFormatReader();
    usingZXing = true; scanning = true;
    scanToggle.textContent = '⏹️ Stop Camera';
    hint('Point at the barcode and hold steady…');
    await zxingReader.decodeFromConstraints(
      { video: { facingMode: 'environment' } }, video,
      (result)=>{ if(result) onCodeFound(result.getText()); }
    );
  }catch(e){
    stopCamera();
    hint(cameraErrorMessage(e));
  }
}

// Warm up the ZXing fallback ahead of time so getUserMedia runs inside the tap gesture.
function prepareScanner(){
  if(!('BarcodeDetector' in window)) ensureZXing().catch(()=>{});
}
function ensureZXing(){
  if(window.ZXing) return Promise.resolve();
  if(zxingLoading) return zxingLoading;
  zxingLoading = new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src='zxing.js';
    s.onload=res; s.onerror=()=>rej(new Error('load')); document.head.appendChild(s);
  });
  return zxingLoading;
}

function stopCamera(){
  scanning = false;
  if(rafId) cancelAnimationFrame(rafId);
  if(usingZXing && zxingReader){ try{ zxingReader.reset(); }catch(e){} }
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  video.srcObject=null;
  scanToggle.textContent = '📷 Start Camera';
}

async function onCodeFound(raw){
  const code = String(raw||'').replace(/[^0-9Xx]/g,'');
  const now = Date.now();
  if(!(code && code.length>=8 && (code!==lastCode || now-lastTime>4000))) return;
  lastCode=code; lastTime=now;
  if(navigator.vibrate) navigator.vibrate(80);
  hint('Found a barcode! Looking it up…');
  const book = await lookupAnyCode(code);
  if(book) showScanResult(book);
  else hint('No book matched that barcode. Try the other barcode on the book, or type the title in 🔍 Find.');
}

async function scanLoop(){
  if(!scanning || usingZXing) return;
  try{
    const codes = await detector.detect(video);
    if(codes.length) onCodeFound(codes[0].rawValue);
  }catch(e){}
  rafId = requestAnimationFrame(scanLoop);
}

const findSearch = document.getElementById('findSearch');
let findTimer=null;
findSearch.addEventListener('input', ()=>{ clearTimeout(findTimer); findTimer=setTimeout(runFind, 450); });
findSearch.addEventListener('keydown', e=>{ if(e.key==='Enter'){ clearTimeout(findTimer); runFind(); }});

async function runFind(){
  const q = findSearch.value.trim();
  const box = document.getElementById('findResults');
  if(!q){ box.innerHTML = `<div class="empty"><div class="big">🌎</div><div>Search for any book in the world.<br>Add it to your Library or Wish List!</div></div>`; return; }
  box.innerHTML = `<div class="loading"><div class="spinner"></div>Searching…</div>`;
  let books = [];
  // 1) Open Library search (no key, no rate limit)
  try{
    const r = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&language=eng&limit=24&fields=title,author_name,first_publish_year,cover_i,isbn,subject`);
    if(r.ok){
      const j = await r.json();
      books = (j.docs||[]).map(fromOpenLibDoc);
    }
  }catch(e){}
  // 2) Fallback to Google Books if Open Library gave nothing
  if(!books.length){
    try{
      const r = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=24&langRestrict=en`);
      if(r.ok){ const j = await r.json(); books = (j.items||[]).map(it=>fromGoogle(it)); }
    }catch(e){}
  }
  if(q !== findSearch.value.trim()) return; // a newer search started
  if(!books.length){ box.innerHTML = `<div class="empty"><div class="big">🔎</div><div>No books found for “${escapeHtml(q)}”.</div></div>`; return; }
  window._findCache = {}; books.forEach((b,i)=> window._findCache['f'+i]=b);

}

function fromOpenLibDoc(d){

    author: (d.author_name||[]).slice(0,2).join(', '),
    year: d.first_publish_year || '',
    genre: pickGenre(d.subject),
    series: '',
    cover: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg` : ''
  };
}

}

function runFindRender(books, box){}

/* =======================================================================
   SERIES TRACKER  —  list a whole series and check off what you own
   series set: { id, name, books:[ {title, have} ] }
   ======================================================================= */
document.getElementById('newSeriesBtn').addEventListener('click', newSeries);

function getSeries(id){ return seriesSets.find(s=>s.id===id); }
function normTitle(t){ return (t||'').toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim(); }
/* True only for titles written in normal English/Latin letters — filters out
   Japanese, Chinese, Korean, Russian, Arabic, Hebrew, etc. */
function isLatinTitle(t){
  if(!t) return false;
  if(/[　-ヿ㐀-鿿가-힯Ѐ-ӿ؀-ۿ֐-׿＀-￯]/.test(t)) return false;
  return /[a-zA-Z]/.test(t);
}
function ownsTitle(title){
  const t=normTitle(title);
  return !!t && library.some(b=>normTitle(b.title)===t);
}
/* Automatically tick off any series book that's now in the Library.
   Only ever turns a check ON — never removes a check you made yourself. */
function syncSeriesWithLibrary(){
  let changed=false;
  seriesSets.forEach(s=> s.books.forEach(b=>{ if(!b.have && ownsTitle(b.title)){ b.have=true; changed=true; } }));
  if(changed) localStorage.setItem(LS_SER, JSON.stringify(seriesSets));
  return changed;
}
/* Remove any non-English (Japanese/Chinese/etc.) book titles left in series
   from before the English filter. Runs silently on every series render. */
function stripForeignSeriesTitles(){
  let changed=false;
  seriesSets.forEach(s=>{
    const before=s.books.length;
    s.books = s.books.filter(b=> isLatinTitle(b.title));
    if(s.books.length!==before) changed=true;
  });
  if(changed) localStorage.setItem(LS_SER, JSON.stringify(seriesSets));
  return changed;
}

function renderSeries(){
  stripForeignSeriesTitles();
  syncSeriesWithLibrary();
  const list = document.getElementById('seriesList');
  if(!seriesSets.length){
    list.innerHTML = `<div class="empty"><div class="big">🔖</div>
      <div>No series yet.<br>Tap <b>➕ Start a New Series</b> to list a whole series<br>and check off the books you have!</div></div>`;
    return;
  }
  const sorted = seriesSets.slice().sort((a,b)=>a.name.localeCompare(b.name));
  list.innerHTML = sorted.map(s=>{
    const have = s.books.filter(b=>b.have).length, tot = s.books.length;
    const pct = tot ? Math.round(have/tot*100) : 0;
    const done = tot>0 && have===tot;
    return `<div class="seriescard" onclick="openSeries('${s.id}')">
        <div class="top">
          <div class="nm">🔖 ${escapeHtml(s.name)} ${done?'🏆':''}</div>
          <div class="gcount">${have}/${tot}</div>
        </div>
        <div class="prog"><span style="width:${pct}%"></span></div>
        <div class="progtxt">${tot? (done?'Complete! You have them all 🎉':`You have ${have} of ${tot}`):'No books added yet — tap to add them'}</div>
      </div>`;
  }).join('');
}

function newSeries(){
  const sheet = document.getElementById('detailSheet');
  sheet.innerHTML = `<div class="grip"></div>
    <h2 style="text-align:center;margin:4px 0 14px">🔖 New Series</h2>
    <div class="field"><label>Series name</label>
      <input id="newSeriesName" placeholder="e.g. Harry Potter" autocomplete="off"></div>
    <button class="btn" onclick="createSeries()">Create series</button>
    <button class="btn ghost" style="margin-top:10px" onclick="closeDetail()">Cancel</button>`;
  showModal();
  setTimeout(()=>{ const el=document.getElementById('newSeriesName'); if(el) el.focus(); },80);
  const el=document.getElementById('newSeriesName');
  el.addEventListener('keydown', e=>{ if(e.key==='Enter') createSeries(); });
}
function createSeries(){
  const name = (document.getElementById('newSeriesName').value||'').trim();
  if(!name){ toast('Please type a series name'); return; }
  const s = { id: uid(), name, books: [] };
  seriesSets.push(s); save(); renderSeries();
  openSeries(s.id);
  toast('Series created 🔖');
}

function openSeries(id){
  stripForeignSeriesTitles();
  syncSeriesWithLibrary();
  const s = getSeries(id); if(!s) return;
  const have = s.books.filter(b=>b.have).length, tot = s.books.length;
  const pct = tot ? Math.round(have/tot*100) : 0;
  const sheet = document.getElementById('detailSheet');

  const items = s.books.map((b,i)=>
    `<div class="checkitem ${b.have?'on':''}">
       <div class="box" onclick="toggleHave('${id}',${i})">${b.have?'✓':''}</div>
       <div class="ct" onclick="toggleHave('${id}',${i})">${escapeHtml(b.title)}</div>
       <div class="rm" onclick="removeSeriesBook('${id}',${i})">✕</div>
     </div>`).join('');

  sheet.innerHTML = `<div class="grip"></div>
    <h2 style="text-align:center;margin:2px 0 4px">🔖 ${escapeHtml(s.name)}</h2>
    <div class="prog" style="max-width:320px;margin:8px auto 4px"><span style="width:${pct}%"></span></div>
    <p style="text-align:center;color:var(--muted);margin:0 0 14px">${tot? `You have ${have} of ${tot}`:'Add the books in this series below'}</p>

    <div id="seriesItems">${items || '<p style="text-align:center;color:var(--muted);margin:6px 0 14px">No books yet — add them one at a time.</p>'}</div>

    <div class="addrow">
      <input id="addBookInput" placeholder="Type a book title…" autocomplete="off">
      <button class="btn sm" style="width:auto" onclick="addSeriesBook('${id}')">Add</button>
    </div>
    <p style="text-align:center;color:var(--ok);font-size:13px;font-weight:600;margin:10px 0 8px">✓ Books you scan into your Library get checked off here automatically</p>
    <button class="btn ghost sm" style="width:100%;margin-bottom:14px" onclick="findSeriesBooks('${id}')">🔎 Find the books online</button>
    <div id="seriesFindBox"></div>

    <div class="btnrow">
      <button class="btn danger" onclick="askDeleteSeries('${id}')">🗑️ Delete series</button>
      <button class="btn ghost" onclick="closeDetail()">Close</button>
    </div>`;
  showModal();
  const inp = document.getElementById('addBookInput');
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') addSeriesBook(id); });
}

function toggleHave(id, i){
  const s=getSeries(id); if(!s||!s.books[i]) return;
  s.books[i].have = !s.books[i].have; save(); openSeries(id); renderSeries();
}
function addSeriesBook(id){
  const s=getSeries(id); if(!s) return;
  const inp=document.getElementById('addBookInput');
  const title=(inp.value||'').trim(); if(!title) return;
  if(s.books.some(b=>b.title.toLowerCase()===title.toLowerCase())){ toast('That book is already in the list'); inp.value=''; return; }
  s.books.push({ title, have: ownsTitle(title) });
  save(); openSeries(id); renderSeries();
}
function removeSeriesBook(id, i){
  const s=getSeries(id); if(!s||!s.books[i]) return;
  s.books.splice(i,1); save(); openSeries(id); renderSeries();
}
function autoCheckOwned(id){
  const s=getSeries(id); if(!s) return;
  let n=0; s.books.forEach(b=>{ if(!b.have && ownsTitle(b.title)){ b.have=true; n++; } });
  save(); openSeries(id); renderSeries();
  toast(n? `Checked off ${n} you own ✓` : 'No matches found in your Library');
}
function askDeleteSeries(id){
  const s=getSeries(id); if(!s) return;
  const sheet=document.getElementById('detailSheet');
  sheet.innerHTML = `<div class="grip"></div>
    <div style="text-align:center;padding:6px 4px 2px">
      <div style="font-size:48px">🗑️</div>
      <h2 style="margin:12px 0 8px">Delete this series?</h2>
      <p style="color:var(--ink);font-weight:600;margin:0 0 6px">“${escapeHtml(s.name)}”</p>
      <p style="color:var(--muted);margin:0 0 20px">The whole checklist will be removed.<br>(Your library books are not affected.)</p>
    </div>
    <button class="btn danger" onclick="deleteSeries('${id}')">Yes, delete it</button>
    <button class="btn ghost" style="margin-top:10px" onclick="openSeries('${id}')">↩️ No, keep it</button>`;
  showModal(()=>openSeries(id));
}
function deleteSeries(id){
  const i=seriesSets.findIndex(s=>s.id===id); if(i<0) return;
  const [s] = seriesSets.splice(i,1);
  const tid = pushTrash('series', s);
  save(); renderSeries(); updateTrashButtons(); closeDetail();
  showUndoToast(`Deleted "${s.name}"`, tid);
}

async function findSeriesBooks(id){
  const s=getSeries(id); if(!s) return;
  const box=document.getElementById('seriesFindBox');
  box.innerHTML=`<div class="loading"><div class="spinner"></div>Looking for books in “${escapeHtml(s.name)}”…</div>`;
  let titles=[];
  try{
    const r=await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(s.name)}&language=eng&limit=30&fields=title`);
    if(r.ok){ const j=await r.json(); titles=(j.docs||[]).map(d=>d.title).filter(isLatinTitle); }
  }catch(e){}
  // de-duplicate (case-insensitive), drop ones already in the list
  const seen=new Set(s.books.map(b=>b.title.toLowerCase()));
  const uniq=[];
  titles.forEach(t=>{ const k=t.toLowerCase(); if(!seen.has(k)){ seen.add(k); uniq.push(t); } });
  const top=uniq.slice(0,12);
  if(!top.length){ box.innerHTML=`<p style="color:var(--muted);text-align:center;margin:8px 0 14px">Couldn’t find more books — add them by title above.</p>`; return; }
  box.innerHTML = `<p style="color:var(--muted);font-size:13px;margin:6px 2px">Tap a book to add it to the list:</p>` +
    top.map(t=>`<button class="genrerow" onclick='addFoundBook("${id}", ${JSON.stringify(t).replace(/'/g,"&#39;")})'>
        <span>${escapeHtml(t)}</span><span class="gcount">＋</span></button>`).join('');
}
function addFoundBook(id, title){
  const s=getSeries(id); if(!s) return;
  if(s.books.some(b=>b.title.toLowerCase()===String(title).toLowerCase())){ toast('Already in the list'); return; }
  s.books.push({ title:String(title), have: ownsTitle(title) });
  save(); renderSeries();
  // refresh the open sheet but keep the found-list visible
  openSeries(id);
  toast('Added ✓');
}

renderAll();
fixNonEnglishTitles();   // quietly convert any foreign book titles to English
checkSharedLink();       // if opened from a friend's share link, show their books

/* Register service worker for offline + home-screen install.
   Also auto-reload once when a new version takes over, so updates show up. */
if('serviceWorker' in navigator){
  let refreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(refreshed) return; refreshed = true; location.reload();
  });
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{ try{ reg.update(); }catch(e){} }).catch(()=>{});
  });
}
